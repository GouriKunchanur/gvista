<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Deep Background Circle / Rounded Box -->
  <rect width="100" height="100" rx="22" fill="#1A120B"/>
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#C9A44C" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Stylized G Monogram with Sound/Stage Flare -->
  <path d="M52 24 C34 24 24 36 24 50 C24 64 35 76 52 76 C65 76 72 68 74 58 L52 58 L52 48 L84 48 C85 54 85 60 83 67 C78 78 67 86 51 86 C29 86 14 70 14 50 C14 30 30 14 52 14 C64 14 74 19 80 27 L71 34 C67 28 60 24 52 24 Z" fill="url(#goldGradient)"/>
  
  <!-- Subtle Sound Wave Nodes in center right -->
  <circle cx="70" cy="38" r="3" fill="#C9A44C"/>
  <circle cx="78" cy="38" r="2" fill="#F5E6C8" fill-opacity="0.7"/>
  <circle cx="84" cy="38" r="1.5" fill="#C9A44C" fill-opacity="0.5"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="goldGradient" x1="14" y1="14" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="50%" stop-color="#C9A44C"/>
      <stop offset="100%" stop-color="#9C7729"/>
    </linearGradient>
  </defs>
</svg>
